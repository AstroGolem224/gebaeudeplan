<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gebäudeplan Rosenstraße 27 – Schemaplan</title>
<style>
:root{--bg:#0e1319;--panel:#161d26;--ink:#e8eef4;--mute:#92a0ae;--acc:#4cc2ff;--warn:#ffb454}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 20px;border-bottom:1px solid #243041}
h1{margin:0;font-size:18px;font-weight:600}
header p{margin:2px 0 0;color:var(--mute);font-size:12.5px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.stage{padding:12px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tab{background:var(--panel);color:var(--ink);border:1px solid #2b394b;border-radius:8px;padding:6px 14px;cursor:pointer;font:inherit}
.tab[aria-selected=true]{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
label.tg{color:var(--mute);font-size:13px;display:flex;gap:5px;align-items:center;cursor:pointer}
svg{width:100%;height:auto;max-height:84vh;background:#0b1016;border:1px solid #1f2a38;border-radius:10px;display:block}
aside{border-left:1px solid #243041;padding:14px 16px;background:var(--panel);min-height:300px}
@media(max-width:900px){aside{border-left:0;border-top:1px solid #243041}}
aside h2{margin:0 0 4px;font-size:16px}
aside .dim{color:var(--acc);font-size:13px;margin-bottom:8px}
aside p{margin:6px 0;font-size:13px}
aside .meta{color:var(--mute);font-size:12px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;border:1px solid}
.c-h{color:#6ee7a0;border-color:#2f7a52}.c-m{color:var(--warn);border-color:#8a6420}.c-l{color:#ff7b7b;border-color:#8a3a3a}
.legend{margin-top:14px;border-top:1px solid #243041;padding-top:10px;font-size:12px;color:var(--mute)}
.legend div{margin:3px 0}
.room{cursor:pointer}
.room:hover{filter:brightness(1.35)}
.rname{font:600 .23px system-ui,sans-serif;fill:#eaf1f7;text-anchor:middle;pointer-events:none}
.rdim{font:.165px system-ui,sans-serif;fill:#9fb0c0;text-anchor:middle;pointer-events:none}
.note{font:.19px system-ui,sans-serif;fill:#7f90a1;text-anchor:middle}
</style>
</head>
<body>
<header>
  <h1>Gebäudeplan · Rosenstraße 27, Köfering (Doppelhaushälfte)</h1>
  <p>Schemaplan nach Skizzen (06.11.) und 31 Fotos, <b>nicht vermessen</b>. Maße „ca.“ geschätzt (± 0,5 m). Norden oben. Raum anklicken für Details.</p>

  </section>
  <aside id="panel"></aside>
</main>

/* ---------- Rendering ---------- */
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('svg'), panel=document.getElementById('panel');
const FILL={ k:'#4a3a2a', w:'#274456', f:'#3a3828', n:'#2a4545', s:'#34345a', u:'#1a222c' };
const CONF={h:'Lage sicher',m:'Lage abgeleitet',l:'Platzhalter / unklar'};
let current='EG', selected=null;
const el=(tag,at,parent)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e;};
const pts=a=>a.map(p=>P(p[0],p[1]).join(',')).join(' ');
const txt=(p,x,y,s,cls,anchor)=>{const t=el('text',{x,y,class:cls||'rdim'},p);if(anchor)t.style.textAnchor=anchor;t.textContent=s;return t;};

function tabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  Object.keys(LEVELS).forEach(k=>{
    const b=document.createElement('button'); b.className='tab';
    b.textContent=k==='SCHNITT'?'Schnitt':k+' · '+LEVELS[k].title;
    b.setAttribute('role','tab'); b.setAttribute('aria-selected',k===current);
    b.onclick=()=>{current=k;selected=null;draw();}; t.appendChild(b);
  });
}
function wallRect(o,x,y,w,t){ // Rechteck auf einer Wand
  return o==='h'?{x,y:y-t/2,w,h:t}:{x:x-t/2,y,w:t,h:w};
}
function drawDoor(d,g){
  const r=wallRect(d.o,d.x,d.y,d.w,0.17);
  el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,fill:'#0b1016'},g);
  if(d.t==='open'){
    const a=d.o==='h'?[[d.x,d.y],[d.x+d.w,d.y]]:[[d.x,d.y],[d.x,d.y+d.w]];
    el('polyline',{points:pts(a),stroke:'#7f90a1','stroke-width':.04,'stroke-dasharray':'.1 .08',fill:'none'},g); return;
  }
  const ha=d.hinge==='a'; let H,u,v;
  if(d.o==='h'){H=[ha?d.x:d.x+d.w,d.y];u=[ha?1:-1,0];v=[0,d.sw];}
  else{H=[d.x,ha?d.y:d.y+d.w];u=[0,ha?1:-1];v=[d.sw,0];}
  const arc=[];for(let i=0;i<=12;i++){const a=i/12*Math.PI/2;arc.push([H[0]+d.w*(Math.cos(a)*u[0]+Math.sin(a)*v[0]),H[1]+d.w*(Math.cos(a)*u[1]+Math.sin(a)*v[1])]);}
  const col=d.t==='entry'?'#4cc2ff':(d.guess?'#ff9d6e':'#c9d4de');
  el('polyline',{points:pts(arc),fill:'none',stroke:col,'stroke-width':.025,opacity:.75,'stroke-dasharray':d.guess?'.08 .06':'0'},g);
  el('polyline',{points:pts([H,arc[12]]),fill:'none',stroke:col,'stroke-width':d.t==='entry'?.07:.045},g);
}
function drawWin(w,g){
  const r=wallRect(w.o,w.x,w.y,w.w,w.t==='tdoor'?.2:.13);
  el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,fill:w.t==='tdoor'?'#2b7fa8':'#0d2a3a',stroke:'#4cc2ff','stroke-width':.03},g);
}
function drawStair(s,g){
  const open=s.kind==='open';
  el('circle',{cx:s.cx,cy:s.cy,r:s.r,fill:open?'#0b1016':'#3b342a',stroke:'#c9a56a','stroke-width':.05,'stroke-dasharray':open?'.15 .1':'0'},g);
  for(let i=0;i<14;i++){const a=i/14*Math.PI*2;el('line',{x1:s.cx,y1:s.cy,x2:s.cx+s.r*Math.cos(a),y2:s.cy+s.r*Math.sin(a),stroke:'#c9a56a','stroke-width':.025,opacity:open?.35:.8},g);}
  el('circle',{cx:s.cx,cy:s.cy,r:.11,fill:'#e8d4a8'},g);
  if(s.kind==='open')txt(g,s.cx,s.cy+s.r+.24,s.label,'rdim'); else txt(g,s.cx+s.r+.08,s.cy+.06,s.label,'rdim','start');
}
function draw(){
  tabs(); svg.innerHTML=''; panel.innerHTML='';
  if(current==='SCHNITT'){drawSection();showIntro();return;}
  const L=LEVELS[current], showDim=document.getElementById('tgDim').checked;
  svg.setAttribute('viewBox',`-1.25 -1.0 ${W+2.5} ${D+(L.balkon?3.4:2.3)}`);
  const defs=el('defs',{},svg);
  const pat=el('pattern',{id:'hatch',width:.28,height:.28,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
  el('line',{x1:0,y1:0,x2:0,y2:.28,stroke:'#4a5866','stroke-width':.05},pat);
  const gR=el('g',{},svg), gF=el('g',{},svg), gS=el('g',{},svg), gD=el('g',{},svg), gT=el('g',{},svg);

  L.rooms.forEach(r=>{
    const sel=selected===r.id, gg=el('g',{class:'room'},gR);
    el('polygon',{points:pts(r.pts),fill:FILL[r.cls]||FILL.u,stroke:sel?'#4cc2ff':'#d7e0e8','stroke-width':sel?.1:.075,'stroke-linejoin':'round','stroke-dasharray':r.conf==='l'?'.22 .12':'0'},gg);
    if(r.conf==='l'||r.cls==='u') el('polygon',{points:pts(r.pts),fill:'url(#hatch)',opacity:.8},gg);
    gg.addEventListener('click',()=>{selected=r.id;draw();});
    const lines=r.name.split('\n');
    lines.forEach((ln,i)=>txt(gT,r.label[0],r.label[1]+i*.26-(lines.length-1)*.13,ln,'rname'));
    if(r.dim&&showDim){const parts=r.dim.split(' + ');
      txt(gT,r.label[0],r.label[1]+lines.length*.26-.06,parts[0],'rdim');
      if(parts[1])txt(gT,r.label[0],r.label[1]+lines.length*.26+.15,'+ '+parts[1],'rdim');}
  });
  // DHH-Trennwand (West, angenommen)
  el('line',{x1:0,y1:0,x2:0,y2:D,stroke:'#ff9d6e','stroke-width':.12,opacity:.55},gR);

  if(document.getElementById('tgFurn').checked){
    L.furn.forEach(f=>{el('rect',{x:f[0],y:f[1],width:f[2],height:f[3],fill:'#ffffff14',stroke:'#8a99a8','stroke-width':.025,rx:.04},gF);
      if(f[4])txt(gF,f[0]+f[2]/2,f[1]+f[3]/2+.06,f[4],'rdim');});
  }
  (L.extra||[]).forEach(e=>{
    if(e.t==='sky'){el('rect',{x:e.x,y:e.y,width:e.w,height:e.h,fill:'#0d2a3a',stroke:'#4cc2ff','stroke-width':.03,'stroke-dasharray':'.08 .05'},gD);
      if(e.n)txt(gT,e.x+e.w/2,e.y-.08,e.n,'rdim');}
    if(e.t==='line'){el('line',{x1:e.a[0],y1:e.a[1],x2:e.b[0],y2:e.b[1],stroke:'#e8eef4','stroke-width':.05,'stroke-dasharray':'.12 .08'},gD);
      txt(gT,e.b[0]+.08,e.b[1]+.1,e.n,'rdim','start');}
  });
  if(L.balkon){const b=L.balkon;
    el('rect',{x:b.x1,y:b.y,width:b.x2-b.x1,height:b.d,fill:'#1d2a36',stroke:'#7f90a1','stroke-width':.04,'stroke-dasharray':'.12 .08'},gF);
    txt(gF,(b.x1+b.x2)/2,b.y+b.d/2+.07,'Balkon','rdim');}
  L.stairs.forEach(s=>drawStair(s,gS));
  L.doors.forEach(d=>drawDoor(d,gD)); L.wins.forEach(w=>drawWin(w,gD));

  const bot=D+(L.balkon?1.2:0);
  txt(gT,W/2,-.55,'▲ NORDEN · Haustür / Zugang','note');
  txt(gT,W/2,bot+(showDim?.95:.5),'▼ SÜDEN · Garten → Vorgarten → Rosenstraße','note');
  const tw=txt(gT,-.6,D/2,'WEST · Nachbar-DHH (angenommen)','note'); tw.setAttribute('transform',`rotate(-90 -.6 ${D/2})`);
  const te=txt(gT,W+.75,D/2,'OST','note'); te.setAttribute('transform',`rotate(90 ${W+.75} ${D/2})`);
  if(showDim){
    el('line',{x1:0,y1:bot+.3,x2:W,y2:bot+.3,stroke:'#566474','stroke-width':.025},gT);
    txt(gT,W/2,bot+.52,'ca. '+W.toFixed(1).replace('.',',')+' m','rdim');
    el('line',{x1:W+.3,y1:0,x2:W+.3,y2:D,stroke:'#566474','stroke-width':.025},gT);
    const t=txt(gT,W+.48,D/2,'ca. '+D.toFixed(1).replace('.',',')+' m','rdim'); t.setAttribute('transform',`rotate(90 ${W+.48} ${D/2})`);
  }
  showPanel(L);
}
function legend(){return `<div class="legend"><div><span class="chip c-h">sicher</span> Raum und Lage aus Fotos klar</div><div><span class="chip c-m">abgeleitet</span> Lage aus Blickrichtungen erschlossen</div><div><span class="chip c-l">unklar</span> Platzhalter (schraffiert/gestrichelt)</div><div>Türen: Viertelkreis = Aufschlag · orange gestrichelt = Tür vermutet · gestrichelt = Öffnung ohne Blatt · blau = Haustür</div><div>Fenster blau · Terrassen-/Balkontür dicker · Dachfenster gestrichelt</div><div>Orange Linie West: Trennwand zur Nachbar-DHH (angenommen)</div><div>Fotos: B1-n = erster Batch (DG/OG), B2-n = zweiter Batch (EG)</div></div>`;}
function showIntro(){
  panel.innerHTML=`<h2>Treppe & Geschosse</h2><p>Eine Wendeltreppe (Holzstufen, Putz-Mittelsäule, schwarzer Handlauf) verbindet UG – EG – OG – DG. Sie liegt nahe der Westwand, im nördlichen Drittel der Haustiefe.</p><p class="meta">Höhen und Stufenzahl geschätzt (Geschosshöhe ca. 2,7 m). Schnitt nur zur Orientierung.</p>`+legend();
}
function showPanel(L){
  const r=L.rooms.find(x=>x.id===selected);
  if(!r){panel.innerHTML=`<h2>${L.title}</h2><p>Raum anklicken für Details.</p>`+legend();return;}
  panel.innerHTML=`<h2>${r.name.replace('\n',' ')}</h2><div class="dim">${r.dim||'Maße unbekannt'}</div><p><span class="chip c-${r.conf}">${CONF[r.conf]}</span></p><p>${r.info}</p><p class="meta">Fotos: ${r.fotos}</p>`+legend();
}
function drawSection(){
  const H=9.2; svg.setAttribute('viewBox',`-1.3 -.8 ${W+2.6} ${H+3.9}`);
  const Yz=y=>H-y, g=el('g',{},svg);
  const defs=el('defs',{},svg), pat=el('pattern',{id:'hatch2',width:.28,height:.28,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
  el('line',{x1:0,y1:0,x2:0,y2:.28,stroke:'#4a5866','stroke-width':.05},pat);
  el('rect',{x:0,y:Yz(-.2),width:W,height:2.4,fill:'url(#hatch2)',stroke:'#7f90a1','stroke-width':.06,'stroke-dasharray':'.2 .12'},g);
  txt(g,W/2+.8,Yz(-.2)+1.3,'UG: Waschraum, Heizung, Abstellraum (keine Fotos)','note');
  [[0,2.5,'Erdgeschoss  ±0,00'],[2.7,5.2,'Obergeschoss  ca. +2,7']].forEach(a=>{
    el('rect',{x:0,y:Yz(a[1]),width:W,height:a[1]-a[0],fill:'#182430',stroke:'#d7e0e8','stroke-width':.07},g);
    txt(g,W-.2,Yz(a[0])-.2,a[2],'rdim','end');
  });
  el('polygon',{points:`0,${Yz(5.4)} ${W},${Yz(5.4)} ${W},${Yz(6.2)} ${W/2},${Yz(8.6)} 0,${Yz(6.2)}`,fill:'#2a2438',stroke:'#d7e0e8','stroke-width':.07},g);
  txt(g,W-.2,Yz(5.4)-.2,'Dachgeschoss  ca. +5,4','rdim','end');
  const cx=STAIR.cx, r=STAIR.r;
  el('rect',{x:cx-.1,y:Yz(5.6),width:.2,height:8.0,fill:'#e8d4a8'},g);
  for(let i=0;i<42;i++){const y=-2.4+i*0.19+.05, side=(i%2?1:-1);
    el('rect',{x:side>0?cx:cx-r,y:Yz(y)-.04,width:r,height:.06,fill:'#c9a56a'},g);}
  txt(g,cx+1.1,Yz(5.7)-.2,'Wendeltreppe UG → DG (schematisch)','note','start');
  txt(g,W/2,-.4,'Schnitt Ost-West durch die Treppe, Blick von Süden · nicht maßstäblich','note');
}
document.getElementById('tgFurn').onchange=draw;
document.getElementById('tgDim').onchange=draw;
draw();
</script>
</body>
